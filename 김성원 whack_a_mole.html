<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>두더지 잡기</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 25%, #76b852 0%, #4a852e 55%, #224c16 100%);
    font-family: 'Malgun Gothic', sans-serif;
    overflow: hidden;
    cursor: none;
    user-select: none;
  }

  #hud {
    position: fixed;
    top: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 40px;
    color: #fff9e6;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    z-index: 10;
    pointer-events: none;
  }
  #hud .box { text-align: center; }
  #hud .label { font-size: 13px; opacity: 0.85; }
  #hud .value { font-size: 28px; font-weight: bold; }

  #board-container {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 620px);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px 24px;
    width: 100%;
    transition: transform 0.05s ease;
  }

  #board.shake {
    animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes screenShake {
    10%, 90% { transform: translate3d(-3px, -2px, 0); }
    20%, 80% { transform: translate3d(4px, 3px, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, -4px, 0); }
    40%, 60% { transform: translate3d(6px, 4px, 0); }
  }

  /* 구멍 전체 래퍼 */
  .hole-wrap {
    position: relative;
    aspect-ratio: 1 / 0.85;
    cursor: none;
  }

  /* 뒤쪽 흙구덩이 (어두운 깊이감) */
  .hole-back {
    position: absolute;
    inset: 10% 4% 15% 4%;
    background: radial-gradient(ellipse at center, #1b110a 0%, #362013 60%, #4a2d1a 100%);
    border-radius: 50%;
    box-shadow: inset 0 12px 18px rgba(0,0,0,0.85);
    z-index: 1;
  }

  /* 마스크 영역: 흙구멍 안에서만 솟아오르게 함 */
  .hole-mask {
    position: absolute;
    inset: -30% 2% 22% 2%;
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
  }

  /* 캐릭터 (두더지 또는 폭탄) */
  .character {
    position: absolute;
    left: 50%;
    bottom: -110%;
    width: 78%;
    height: 90%;
    transform: translateX(-50%);
    transition: bottom 0.16s cubic-bezier(.34,1.45,.64,1);
    pointer-events: auto;
    cursor: none;
    z-index: 2;
  }

  .hole-wrap.up .character {
    bottom: 2%;
  }

  .hole-wrap.hit .character {
    transition: bottom 0.1s ease-in;
    bottom: -110%;
    filter: brightness(0.6);
  }

  .character svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  }

  /* 앞쪽 잔디 둔덕 (두더지 하단을 자연스럽게 감춤) */
  .hole-front {
    position: absolute;
    bottom: 12%;
    left: 4%;
    right: 4%;
    height: 34%;
    background: radial-gradient(ellipse at 50% 100%, #589134 0%, #3f7023 60%, #294c14 100%);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    border-top: 3px solid #234211;
    box-shadow: 0 8px 14px rgba(0,0,0,0.35);
    z-index: 3;
    pointer-events: none;
  }

  /* 말풍선 */
  .bubble {
    position: absolute;
    top: -12%;
    left: 50%;
    transform: translate(-50%, -100%) scale(0.6);
    background: #ffffff;
    color: #2a1400;
    font-weight: bold;
    font-size: 13px;
    padding: 5px 11px;
    border-radius: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 6px 0 6px;
    border-style: solid;
    border-color: #ffffff transparent transparent transparent;
  }
  .hole-wrap.up .bubble {
    opacity: 1;
    transform: translate(-50%, -100%) scale(1);
  }

  .bubble.bomb-bubble {
    background: #ff4d4f;
    color: #ffffff;
    border-color: #ff4d4f;
  }
  .bubble.bomb-bubble::after {
    border-color: #ff4d4f transparent transparent transparent;
  }

  /* 타격 이펙트 텍스트 */
  .hit-text {
    position: absolute;
    top: 5%;
    left: 50%;
    color: #ffd93d;
    font-weight: 900;
    font-size: 24px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.7), 0 0 10px #ff922b;
    pointer-events: none;
    z-index: 6;
    animation: hitFloat 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes hitFloat {
    0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
    30% { transform: translate(-50%, -24px) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }

  /* 뿅망치 커서 */
  #hammer {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 48px;
    transform-origin: 80% 80%;
    pointer-events: none;
    z-index: 40;
    transform: translate(-20px, -24px) rotate(-30deg);
    transition: transform 0.06s ease;
  }
  #hammer.swing {
    transform: translate(-20px, -24px) rotate(25deg) scale(1.15);
  }

  /* 오버레이 */
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(12, 24, 8, 0.85);
    color: #fff9e6;
    text-align: center;
    z-index: 30;
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  .overlay h1 { font-size: 38px; margin-bottom: 8px; }
  .overlay p { font-size: 17px; opacity: 0.9; margin-bottom: 22px; max-width: 480px; line-height: 1.5; }

  .diffRow {
    display: flex;
    gap: 14px;
    margin-bottom: 12px;
  }
  button.diffBtn, #restartBtn {
    padding: 12px 26px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    background: #ff8a3d;
    color: #2a1400;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.15s, background 0.15s;
  }
  button.diffBtn:hover, #restartBtn:hover {
    background: #ffa15e;
    transform: translateY(-2px);
  }
  button.diffBtn.selected { background: #4dabf7; color: white; }

  #startHint {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff9e6;
    opacity: 0.9;
    font-size: 14px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.6);
    z-index: 10;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="box">
    <div class="label" id="scoreLabel">점수 (목표 500)</div>
    <div class="value" id="scoreVal">0</div>
  </div>
  <div class="box">
    <div class="label">남은 시간</div>
    <div class="value" id="timeVal">20</div>
  </div>
</div>

<div id="board-container">
  <div id="board"></div>
</div>

<div id="startHint">🔨 튀어나오는 두더지를 망치로 치세요! 💣 폭탄을 치면 게임 오버!</div>

<div id="hammer">🔨</div>

<div class="overlay" id="startOverlay" style="display:flex;">
  <h1>두더지 잡기</h1>
  <p>구멍에서 올라오는 두더지를 재빠르게 쳐서 점수를 모으세요!<br>난이도 보통 이상에서는 <strong>💣 폭탄</strong>이 나타나며, 치면 즉시 탈락합니다!</p>
  <div class="diffRow">
    <button class="diffBtn" data-diff="easy">쉬움<br><span style="font-size:12px; font-weight:normal;">두더지만 출현</span></button>
    <button class="diffBtn selected" data-diff="normal">보통<br><span style="font-size:12px; font-weight:normal;">가끔 폭탄 출현</span></button>
    <button class="diffBtn" data-diff="hard">어려움<br><span style="font-size:12px; font-weight:normal;">폭탄 다수 출현!</span></button>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <h1 id="endTitle">게임 종료!</h1>
  <p id="finalScore">최종 점수: 0</p>
  <button id="restartBtn">다시 시작</button>
</div>

<script>
const board = document.getElementById('board');
const scoreVal = document.getElementById('scoreVal');
const scoreLabel = document.getElementById('scoreLabel');
const timeVal = document.getElementById('timeVal');
const startOverlay = document.getElementById('startOverlay');
const endOverlay = document.getElementById('endOverlay');
const endTitle = document.getElementById('endTitle');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
const hammer = document.getElementById('hammer');

const HOLE_COUNT = 9;
const GAME_TIME = 20;

const TAUNTS = ['때려봐라!', '못 잡지롱~', '여기야 여기!', '약오르지?'];
const BOMB_TAUNTS = ['치면 폭발! 💣', '위험해! ⚠️', '건드리지 마!', '꽝! 준비완료'];
const OUCH = ['아야!', '퍽!', '명중!', '+20점'];

const DIFFICULTY = {
  easy:   { target: 400, upDuration: 1100, minUpDuration: 700, spawnDelay: 750, minSpawnDelay: 480, bombRate: 0.00 },
  normal: { target: 500, upDuration: 900,  minUpDuration: 520, spawnDelay: 600, minSpawnDelay: 350, bombRate: 0.22 },
  hard:   { target: 600, upDuration: 700,  minUpDuration: 360, spawnDelay: 430, minSpawnDelay: 220, bombRate: 0.32 }
};

let holes = [];
let score = 0;
let timeLeft = GAME_TIME;
let running = false;
let spawnTimeoutId = null;
let timerIntervalId = null;
let currentDiffKey = 'normal';
let diffSettings = DIFFICULTY.normal;

// 일반 두더지 SVG
const moleSVG = `
<svg viewBox="0 0 100 100">
  <!-- 몸통 및 머리 -->
  <ellipse cx="50" cy="56" rx="33" ry="31" fill="#8a5a2b"/>
  <ellipse cx="50" cy="63" rx="21" ry="15" fill="#c98d55"/>
  <!-- 귀 -->
  <circle cx="25" cy="38" r="8" fill="#8a5a2b"/>
  <circle cx="25" cy="38" r="4.5" fill="#f4a261"/>
  <circle cx="75" cy="38" r="8" fill="#8a5a2b"/>
  <circle cx="75" cy="38" r="4.5" fill="#f4a261"/>
  <!-- 눈 -->
  <circle cx="38" cy="46" r="5.5" fill="#1a1a1a"/>
  <circle cx="62" cy="46" r="5.5" fill="#1a1a1a"/>
  <circle cx="40" cy="44" r="2" fill="#ffffff"/>
  <circle cx="64" cy="44" r="2" fill="#ffffff"/>
  <!-- 코와 입, 앞니 -->
  <ellipse cx="50" cy="54" rx="7" ry="5" fill="#e76f51"/>
  <rect x="47" y="60" width="6" height="5" rx="1" fill="#ffffff"/>
  <!-- 수염 -->
  <line x1="22" y1="52" x2="34" y2="54" stroke="#4a3018" stroke-width="1.8"/>
  <line x1="22" y1="58" x2="34" y2="57" stroke="#4a3018" stroke-width="1.8"/>
  <line x1="78" y1="52" x2="66" y2="54" stroke="#4a3018" stroke-width="1.8"/>
  <line x1="78" y1="58" x2="66" y2="57" stroke="#4a3018" stroke-width="1.8"/>
</svg>`;

// 피격당한 두더지 SVG (X_X 눈)
const moleHitSVG = `
<svg viewBox="0 0 100 100">
  <ellipse cx="50" cy="56" rx="33" ry="31" fill="#754b22"/>
  <ellipse cx="50" cy="63" rx="21" ry="15" fill="#b07a46"/>
  <circle cx="25" cy="38" r="8" fill="#754b22"/>
  <circle cx="75" cy="38" r="8" fill="#754b22"/>
  <!-- X 눈 -->
  <line x1="33" y1="42" x2="43" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="43" y1="42" x2="33" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="57" y1="42" x2="67" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="67" y1="42" x2="57" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- 코와 입 -->
  <ellipse cx="50" cy="54" rx="7" ry="5" fill="#cf5c3e"/>
  <ellipse cx="50" cy="63" rx="6" ry="3" fill="#1a1a1a"/>
</svg>`;

// 폭탄 두더지 / 시한폭탄 SVG
const bombSVG = `
<svg viewBox="0 0 100 100">
  <!-- 도화선 -->
  <path d="M 50 25 Q 58 10 68 12" fill="none" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 불꽃 스파크 -->
  <circle cx="70" cy="11" r="5" fill="#ff4d4f"/>
  <circle cx="70" cy="11" r="2.5" fill="#ffd43b"/>
  <!-- 폭탄 캡 -->
  <rect x="43" y="24" width="14" height="6" rx="2" fill="#495057"/>
  <!-- 폭탄 몸체 -->
  <circle cx="50" cy="57" r="33" fill="#212529"/>
  <circle cx="39" cy="45" r="7" fill="rgba(255,255,255,0.2)"/>
  <!-- 붉은 성난 눈 -->
  <circle cx="39" cy="53" r="5.5" fill="#ff3838"/>
  <circle cx="61" cy="53" r="5.5" fill="#ff3838"/>
  <circle cx="40" cy="52" r="2" fill="#ffffff"/>
  <circle cx="62" cy="52" r="2" fill="#ffffff"/>
  <!-- 해골 치아 또는 번개 -->
  <polygon points="50,60 43,68 57,68" fill="#ff3838"/>
  <line x1="33" y1="45" x2="45" y2="49" stroke="#ff3838" stroke-width="3" stroke-linecap="round"/>
  <line x1="67" y1="45" x2="55" y2="49" stroke="#ff3838" stroke-width="3" stroke-linecap="round"/>
</svg>`;

function buildBoard() {
  board.innerHTML = '';
  holes = [];
  for (let i = 0; i < HOLE_COUNT; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'hole-wrap';

    const back = document.createElement('div');
    back.className = 'hole-back';
    wrap.appendChild(back);

    const mask = document.createElement('div');
    mask.className = 'hole-mask';

    const character = document.createElement('div');
    character.className = 'character';
    character.innerHTML = moleSVG;
    mask.appendChild(character);
    wrap.appendChild(mask);

    const front = document.createElement('div');
    front.className = 'hole-front';
    wrap.appendChild(front);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    wrap.appendChild(bubble);

    board.appendChild(wrap);

    const state = {
      el: wrap,
      character,
      bubble,
      up: false,
      isBomb: false,
      hit: false,
      hideTimeoutId: null
    };

    const whack = (e) => {
      e.preventDefault();
      if (!running || !state.up || state.hit) return;

      state.hit = true;
      clearTimeout(state.hideTimeoutId);

      if (state.isBomb) {
        // 폭탄을 침 -> 게임 오버!
        board.classList.add('shake');
        setTimeout(() => board.classList.remove('shake'), 450);
        showHitText(wrap, '💥 쾅!!');
        state.character.style.filter = 'brightness(2) contrast(2)';
        endGame(false, 'bomb');
      } else {
        // 일반 두더지를 침 -> 점수 획득!
        state.character.innerHTML = moleHitSVG;
        showHitText(wrap, OUCH[Math.floor(Math.random() * OUCH.length)]);
        score += 20;
        scoreVal.textContent = score;

        wrap.classList.remove('up');
        wrap.classList.add('hit');

        setTimeout(() => {
          wrap.classList.remove('hit');
          state.up = false;
          state.hit = false;
          state.character.innerHTML = moleSVG;
        }, 250);

        if (score >= diffSettings.target) {
          endGame(true);
        }
      }
    };

    wrap.addEventListener('mousedown', whack);
    wrap.addEventListener('touchstart', whack, { passive: false });
    holes.push(state);
  }
}

function showHitText(holeWrap, text) {
  const el = document.createElement('div');
  el.className = 'hit-text';
  el.textContent = text;
  holeWrap.appendChild(el);
  setTimeout(() => el.remove(), 650);
}

function randomHiddenHole() {
  const candidates = holes.filter(h => !h.up);
  if (candidates.length === 0) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function popUpRandomMole() {
  if (!running) return;

  const state = randomHiddenHole();
  if (state) {
    state.up = true;
    state.hit = false;

    // 난이도별 폭탄 출현 여부 결정
    state.isBomb = Math.random() < diffSettings.bombRate;

    if (state.isBomb) {
      state.character.innerHTML = bombSVG;
      state.bubble.textContent = BOMB_TAUNTS[Math.floor(Math.random() * BOMB_TAUNTS.length)];
      state.bubble.classList.add('bomb-bubble');
    } else {
      state.character.innerHTML = moleSVG;
      state.bubble.textContent = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
      state.bubble.classList.remove('bomb-bubble');
    }

    state.el.classList.add('up');

    const elapsed = GAME_TIME - timeLeft;
    const upDuration = Math.max(diffSettings.minUpDuration, diffSettings.upDuration - elapsed * 20);

    state.hideTimeoutId = setTimeout(() => {
      state.up = false;
      state.el.classList.remove('up');
      setTimeout(() => {
        if (!state.up) state.character.innerHTML = moleSVG;
      }, 200);
    }, upDuration);
  }

  const elapsed = GAME_TIME - timeLeft;
  const nextDelay = Math.max(diffSettings.minSpawnDelay, diffSettings.spawnDelay - elapsed * 12) + Math.random() * 200;
  spawnTimeoutId = setTimeout(popUpRandomMole, nextDelay);
}

function startGame(diffKey) {
  currentDiffKey = diffKey;
  diffSettings = DIFFICULTY[diffKey] || DIFFICULTY.normal;

  buildBoard();
  score = 0;
  timeLeft = GAME_TIME;
  scoreVal.textContent = score;
  scoreLabel.textContent = `점수 (목표 ${diffSettings.target})`;
  timeVal.textContent = timeLeft;
  startOverlay.style.display = 'none';
  endOverlay.style.display = 'none';
  running = true;

  clearTimeout(spawnTimeoutId);
  clearInterval(timerIntervalId);

  spawnTimeoutId = setTimeout(popUpRandomMole, 400);
  timerIntervalId = setInterval(() => {
    timeLeft -= 1;
    timeVal.textContent = timeLeft;
    if (timeLeft <= 0) endGame(false, 'timeout');
  }, 1000);
}

function endGame(won, reason = 'timeout') {
  if (!running) return;
  running = false;
  clearTimeout(spawnTimeoutId);
  clearInterval(timerIntervalId);
  holes.forEach(h => {
    clearTimeout(h.hideTimeoutId);
    h.up = false;
    h.el.classList.remove('up');
  });

  if (won) {
    endTitle.textContent = `승리! 목표 ${diffSettings.target}점 달성! 🎉`;
    finalScore.textContent = `최종 점수: ${score}점`;
  } else {
    if (reason === 'bomb') {
      endTitle.textContent = '💥 폭탄 폭발! 게임 오버!';
      finalScore.textContent = `폭탄을 때려 탈락했습니다! (최종 점수: ${score}점)`;
    } else {
      endTitle.textContent = '시간 종료!';
      finalScore.textContent = `최종 점수: ${score} / 목표 ${diffSettings.target}점`;
    }
  }
  endOverlay.style.display = 'flex';
}

document.querySelectorAll('.diffBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diffBtn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    startGame(btn.dataset.diff);
  });
});

restartBtn.addEventListener('click', () => {
  endOverlay.style.display = 'none';
  startOverlay.style.display = 'flex';
});

// 뿅망치 커서 따라다니기 및 스윙 모션
window.addEventListener('mousemove', (e) => {
  hammer.style.left = e.clientX + 'px';
  hammer.style.top = e.clientY + 'px';
});
window.addEventListener('mousedown', () => {
  hammer.classList.add('swing');
});
window.addEventListener('mouseup', () => {
  hammer.classList.remove('swing');
});

// 모바일 터치 대응
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    hammer.style.left = e.touches[0].clientX + 'px';
    hammer.style.top = e.touches[0].clientY + 'px';
  }
}, { passive: true });
window.addEventListener('touchstart', (e) => {
  if (e.touches.length > 0) {
    hammer.style.left = e.touches[0].clientX + 'px';
    hammer.style.top = e.touches[0].clientY + 'px';
  }
  hammer.classList.add('swing');
}, { passive: true });
window.addEventListener('touchend', () => {
  hammer.classList.remove('swing');
}, { passive: true });

buildBoard();
</script>
</body>
</html>
