<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>튀기는 공</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // 3초마다 순환하는 공 색상 팔레트
  const colorPalette = [
    ['#ffdd55', '#ff5533'],
    ['#55ffdd', '#3388ff'],
    ['#ff55dd', '#8833ff'],
    ['#aaff55', '#33aa33'],
    ['#ff8855', '#ff3355'],
    ['#55aaff', '#5533ff']
  ];

  const BALL_COUNT = 12;
  const balls = [];

  function randomSpeed() {
    const s = 3 + Math.random() * 5;
    return Math.random() < 0.5 ? s : -s;
  }

  for (let i = 0; i < BALL_COUNT; i++) {
    const radius = 15 + Math.random() * 25;
    balls.push({
      x: Math.random() * (window.innerWidth - radius * 2) + radius,
      y: Math.random() * (window.innerHeight - radius * 2) + radius,
      radius,
      vx: randomSpeed(),
      vy: randomSpeed(),
      colorIndex: Math.floor(Math.random() * colorPalette.length),
      trail: []
    });
  }

  // 각 공이 독립적으로 3초마다 색을 바꾸도록 개별 타이머 부여
  balls.forEach((b) => {
    setInterval(() => {
      b.colorIndex = (b.colorIndex + 1) % colorPalette.length;
    }, 3000);
  });

  function update(b) {
    b.x += b.vx;
    b.y += b.vy;

    if (b.x + b.radius > canvas.width) {
      b.x = canvas.width - b.radius;
      b.vx *= -1;
    } else if (b.x - b.radius < 0) {
      b.x = b.radius;
      b.vx *= -1;
    }

    if (b.y + b.radius > canvas.height) {
      b.y = canvas.height - b.radius;
      b.vy *= -1;
    } else if (b.y - b.radius < 0) {
      b.y = b.radius;
      b.vy *= -1;
    }

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 12) b.trail.shift();
  }

  function draw(b) {
    const color = colorPalette[b.colorIndex];

    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const alpha = (i / b.trail.length) * 0.25;
      const r = b.radius * (i / b.trail.length);
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(color[1], alpha);
      ctx.fill();
    }

    const gradient = ctx.createRadialGradient(
      b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.1,
      b.x, b.y, b.radius
    );
    gradient.addColorStop(0, color[0]);
    gradient.addColorStop(1, color[1]);

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const b of balls) {
      update(b);
      draw(b);
    }
    requestAnimationFrame(loop);
  }

  loop();

  // 클릭하면 새 공을 그 위치에 추가
  canvas.addEventListener('click', (e) => {
    const radius = 15 + Math.random() * 25;
    balls.push({
      x: e.clientX,
      y: e.clientY,
      radius,
      vx: randomSpeed(),
      vy: randomSpeed(),
      colorIndex: Math.floor(Math.random() * colorPalette.length),
      trail: []
    });
  });
</script>
</body>
</html>
